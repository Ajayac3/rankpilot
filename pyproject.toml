[project]
name = "rankpilot"
version = "0.1.0"
description = "Generic SEO monitoring and intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "spacy>=3.7",
    "scikit-learn>=1.4",
    "streamlit>=1.35",
    "apscheduler>=3.10",
    "google-auth>=2.29",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.126",
    "google-analytics-data>=0.18",
    "google-auth-oauthlib>=1.2",
    "anthropic>=0.28",
    "praw>=7.7",         # Reddit API
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "rich>=13.7",        # Pretty terminal output
    # crawl4ai>=0.8.6 — requires lxml~=5.3 which has no wheel for Python 3.14/Fedora
    # JS crawling handled by Playwright directly via utils/crawl.py
    "bing-webmaster-tools>=0.1",  # Bing WMT REST API client
    "index-now-for-python>=2.0",  # IndexNow URL submission
    "llms-txt>=0.0.1",   # llms.txt spec utilities
    "jsonschema>=4.22",  # Local JSON-LD schema validation
    "pandas>=2.1",       # Dashboard data frames (used by Streamlit pages)
    "warcio>=1.7",       # CommonCrawl WAT record parsing
    "cdx-toolkit>=0.9",  # CommonCrawl CDX index queries
    "pytrends>=4.9",     # Google Trends (relative keyword volume, unofficial)
    "fpdf2>=2.7",        # PDF report generation (pure Python)
]
